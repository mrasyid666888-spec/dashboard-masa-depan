<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabunganKu - Mobile Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f3f4f6;
            color: #1f2937;
        }
        /* Style khusus untuk wrapper mirip HP di layar desktop */
        .mobile-container {
            max-width: 480px;
            margin: auto;
            min-height: 100vh;
            background-color: #e5e7eb;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="font-sans">

    <div class="mobile-container flex flex-col justify-between pb-24">
        
        <div>
            <div class="p-6 bg-[#d9dde0] rounded-b-[2.5rem] shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-xl font-bold text-slate-800">Halo, Rasyid! 👋</h1>
                        <p class="text-xs text-slate-600 mt-0.5">Yuk cek uang kamu hari ini</p>
                    </div>
                    <button onclick="logout()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow hover:bg-slate-100 transition" title="Logout">
                        <i class="fas fa-sign-out-alt text-slate-700 text-sm"></i>
                    </button>
                </div>

                <div class="text-center py-4">
                    <div class="inline-block px-3 py-1 bg-white/60 backdrop-blur rounded-full text-xs font-semibold text-slate-700 mb-2 shadow-sm">
                        <span id="dompetLabel">Dompet Utama</span>
                    </div>
                    <h2 id="totalSaldo" class="text-3xl font-black text-slate-900 tracking-tight">Rp 0</h2>
                    <div id="statusKeuangan" class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"></div>
                </div>
            </div>

            <div class="px-6 -mt-4">
                <div class="bg-[#fffdf5] p-5 rounded-3xl shadow-md border border-amber-100">
                    <h3 class="text-sm font-bold text-slate-800 mb-3">Yuk Catat!</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="bukaForm('masuk')" class="flex items-center justify-center gap-2 py-3 px-4 bg-white border border-slate-200 rounded-2xl shadow-sm hover:border-emerald-500 hover:text-emerald-600 transition font-semibold text-xs text-slate-700">
                            <span class="w-7 h-7 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs">
                                <i class="fas fa-arrow-down"></i>
                            </span>
                            Pemasukan
                        </button>
                        <button onclick="bukaForm('keluar')" class="flex items-center justify-center gap-2 py-3 px-4 bg-white border border-slate-200 rounded-2xl shadow-sm hover:border-rose-500 hover:text-rose-600 transition font-semibold text-xs text-slate-700">
                            <span class="w-7 h-7 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-xs">
                                <i class="fas fa-arrow-up"></i>
                            </span>
                            Pengeluaran
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-6 mt-4 grid grid-cols-2 gap-3">
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-[11px] text-slate-500">Dana Masuk</p>
                    <h4 id="totalMasuk" class="text-sm font-bold text-emerald-600 mt-0.5">Rp 0</h4>
                </div>
                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-[11px] text-slate-500">Dana Keluar</p>
                    <h4 id="totalKeluar" class="text-sm font-bold text-rose-600 mt-0.5">Rp 0</h4>
                </div>
            </div>

            <div class="px-6 mt-6">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-800">Riwayat Transaksi</h3>
                    <input type="text" id="inputPencarian" placeholder="Cari..." class="bg-white border border-slate-200 rounded-xl px-3 py-1 text-xs text-slate-700 focus:outline-none focus:border-sky-500 w-36">
                </div>
                
                <div id="tabelTransaksi" class="space-y-2.5">
                    </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-slate-200 py-3 px-6 flex justify-around items-center z-40 shadow-lg">
            <button onclick="pindahTab('home')" class="flex flex-col items-center text-sky-600">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Home</span>
            </button>
            <button onclick="resetData()" class="flex flex-col items-center text-slate-400 hover:text-red-500 transition">
                <i class="fas fa-trash-alt text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Reset</span>
            </button>
        </div>

    </div>

    <div id="modalTransaksi" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-sm rounded-t-[2rem] sm:rounded-3xl p-6 shadow-2xl animate-fade-in">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-base font-bold text-slate-800">Tambah Transaksi</h3>
                <button onclick="tutupForm()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="transaksiForm" class="space-y-3">
                <input type="hidden" id="tipe">
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Keterangan</label>
                    <input type="text" id="keterangan" required placeholder="Contoh: Gaji / Beli Makan" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Jumlah (Rp)</label>
                    <input type="number" id="jumlah" required placeholder="Contoh: 50000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">Tanggal</label>
                    <input type="date" id="tanggal" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs transition shadow-md mt-2">
                    Simpan Transaksi
                </button>
            </form>
        </div>
    </div>

    <script>
        let transaksiList = JSON.parse(localStorage.getItem('transaksi')) || [];

        const form = document.getElementById('transaksiForm');
        const keteranganInput = document.getElementById('keterangan');
        const jumlahInput = document.getElementById('jumlah');
        const tanggalInput = document.getElementById('tanggal');
        const tipeInput = document.getElementById('tipe');
        
        const totalSaldoEl = document.getElementById('totalSaldo');
        const totalMasukEl = document.getElementById('totalMasuk');
        const totalKeluarEl = document.getElementById('totalKeluar');
        const tabelTransaksiEl = document.getElementById('tabelTransaksi');

        // Set tanggal hari ini secara default ke form
        tanggalInput.valueAsDate = new Date();

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function updateDashboard() {
            tabelTransaksiEl.innerHTML = '';
            let totalMasuk = 0;
            let totalKeluar = 0;

            if (transaksiList.length === 0) {
                tabelTransaksiEl.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs bg-white rounded-2xl p-4 border border-slate-100">Belum ada transaksi tercatat.</div>`;
            }

            transaksiList.forEach((item, index) => {
                if (item.tipe === 'masuk') {
                    totalMasuk += Number(item.jumlah);
                } else {
                    totalKeluar += Number(item.jumlah);
                }

                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-xs ${item.tipe === 'masuk' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                            <i class="fas ${item.tipe === 'masuk' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-slate-800">${item.keterangan}</h4>
                            <span class="text-[10px] text-slate-400">${item.tanggal}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold ${item.tipe === 'masuk' ? 'text-emerald-600' : 'text-rose-600'}">
                            ${item.tipe === 'masuk' ? '+' : '-'} ${formatRupiah(item.jumlah)}
                        </span>
                        <button onclick="hapusTransaksi(${index})" class="text-slate-300 hover:text-red-500 text-xs transition">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                tabelTransaksiEl.appendChild(card);
            });

            let saldoAkhir = totalMasuk - totalKeluar;
            totalSaldoEl.innerText = formatRupiah(saldoAkhir);
            totalMasukEl.innerText = formatRupiah(totalMasuk);
            totalKeluarEl.innerText = formatRupiah(totalKeluar);

            localStorage.setItem('transaksi', JSON.stringify(transaksiList));

            // Status Badge
            const statusEl = document.getElementById('statusKeuangan');
            if (statusEl) {
                if (totalMasuk === 0 && totalKeluar === 0) {
                    statusEl.className = "mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-slate-200 text-slate-600";
                    statusEl.innerHTML = 'Belum Ada Aktivitas';
                } else if (totalMasuk >= totalKeluar) {
                    statusEl.className = "mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 text-emerald-700";
                    statusEl.innerHTML = '✨ Keuangan Aman';
                } else {
                    statusEl.className = "mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-rose-100 text-rose-700";
                    statusEl.innerHTML = '⚠️ Pengeluaran Tinggi';
                }
            }
        }

        function bukaForm(tipe) {
            tipeInput.value = tipe;
            document.getElementById('modalTitle').innerText = tipe === 'masuk' ? 'Tambah Pemasukan' : 'Tambah Pengeluaran';
            document.getElementById('modalTransaksi').classList.remove('hidden');
        }

        function tutupForm() {
            document.getElementById('modalTransaksi').classList.add('hidden');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const baru = {
                keterangan: keteranganInput.value,
                tanggal: tanggalInput.value,
                jumlah: Number(jumlahInput.value),
                tipe: tipeInput.value
            };
            transaksiList.push(baru);
            keteranganInput.value = '';
            jumlahInput.value = '';
            tutupForm();
            updateDashboard();
        });

        function hapusTransaksi(index) {
            if (confirm("Hapus catatan ini?")) {
                transaksiList.splice(index, 1);
                updateDashboard();
            }
        }

        function resetData() {
            if (confirm("Yakin ingin mereset semua data?")) {
                transaksiList = [];
                updateDashboard();
            }
        }

        function logout() {
            if (confirm("Keluar dari aplikasi?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Fitur Pencarian Real-time
        const inputPencarian = document.getElementById('inputPencarian');
        if (inputPencarian) {
            inputPencarian.addEventListener('keyup', function() {
                const keyword = this.value.toLowerCase();
                const cards = document.querySelectorAll('#tabelTransaksi > div');
                cards.forEach(card => {
                    const text = card.innerText.toLowerCase();
                    card.style.display = text.includes(keyword) ? 'flex' : 'none';
                });
            });
        }

        // Jalankan saat pertama muat
        updateDashboard();
    </script>
</body>
</html>
