<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabunganKu - Dark Mobile Style + Rekapan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .mobile-container {
            max-width: 480px;
            margin: auto;
            min-height: 100vh;
            background-color: #1e293b;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body class="font-sans">

    <div class="mobile-container flex flex-col justify-between pb-24">
        
        <div id="tabHome" class="tab-content">
            <div class="p-6 bg-[#0f172a] rounded-b-[2.5rem] border-b border-slate-800 shadow-md">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-xl font-bold text-white">Halo! 👋</h1>
                        <p class="text-xs text-slate-400 mt-0.5">Yuk cek uang kamu hari ini</p>
                    </div>
                    <button onclick="logout()" class="w-10 h-10 bg-slate-800 border border-slate-700 rounded-full flex items-center justify-center shadow hover:bg-slate-700 transition" title="Logout">
                        <i class="fas fa-sign-out-alt text-rose-400 text-sm"></i>
                    </button>
                </div>

                <div class="text-center py-4">
                    <div class="inline-block px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-xs font-semibold text-slate-300 mb-2 shadow-sm">
                        <span id="dompetLabel">Dompet Utama</span>
                    </div>
                    <h2 id="totalSaldo" class="text-3xl font-black text-white tracking-tight">Rp 0</h2>
                    <div id="statusKeuangan" class="mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"></div>
                </div>
            </div>

            <div class="px-6 -mt-4">
                <div class="bg-slate-900/95 backdrop-blur p-5 rounded-3xl shadow-lg border border-slate-800">
                    <h3 class="text-sm font-bold text-slate-200 mb-3">Yuk Catat!</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="bukaForm('masuk')" class="flex items-center justify-center gap-2 py-3 px-4 bg-slate-800 border border-slate-700 rounded-2xl shadow-sm hover:border-emerald-500 hover:text-emerald-400 transition font-semibold text-xs text-slate-200">
                            <span class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
                                <i class="fas fa-arrow-down"></i>
                            </span>
                            Pemasukan
                        </button>
                        <button onclick="bukaForm('keluar')" class="flex items-center justify-center gap-2 py-3 px-4 bg-slate-800 border border-slate-700 rounded-2xl shadow-sm hover:border-rose-500 hover:text-rose-400 transition font-semibold text-xs text-slate-200">
                            <span class="w-7 h-7 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs">
                                <i class="fas fa-arrow-up"></i>
                            </span>
                            Pengeluaran
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-6 mt-4 grid grid-cols-2 gap-3">
                <div class="bg-slate-900/80 p-3.5 rounded-2xl shadow-sm border border-slate-800">
                    <p class="text-[11px] text-slate-400">Dana Masuk</p>
                    <h4 id="totalMasuk" class="text-sm font-bold text-emerald-400 mt-0.5">Rp 0</h4>
                </div>
                <div class="bg-slate-900/80 p-3.5 rounded-2xl shadow-sm border border-slate-800">
                    <p class="text-[11px] text-slate-400">Dana Keluar</p>
                    <h4 id="totalKeluar" class="text-sm font-bold text-rose-400 mt-0.5">Rp 0</h4>
                </div>
            </div>

            <div class="px-6 mt-6">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-200">Riwayat Transaksi</h3>
                    <input type="text" id="inputPencarian" placeholder="Cari..." class="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1 text-xs text-slate-200 focus:outline-none focus:border-sky-500 w-36">
                </div>
                
                <div id="tabelTransaksi" class="space-y-2.5">
                    </div>
            </div>
        </div>

        <div id="tabRekap" class="tab-content hidden p-6">
            <h2 class="text-lg font-bold text-white mb-1"><i class="fas fa-calendar-alt text-sky-400 mr-2"></i> Rekapan Bulanan</h2>
            <p class="text-xs text-slate-400 mb-5">Ringkasan keuangan berdasarkan bulan transaksi.</p>
            
            <div id="containerRekapBulanan" class="space-y-3">
                </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-slate-900 border-t border-slate-800 py-3 px-6 flex justify-around items-center z-40 shadow-2xl">
            <button onclick="pindahTab('home')" id="navHome" class="flex flex-col items-center text-sky-400 transition">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Home</span>
            </button>
            <button onclick="pindahTab('rekap')" id="navRekap" class="flex flex-col items-center text-slate-500 hover:text-sky-400 transition">
                <i class="fas fa-chart-bar text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Rekapan</span>
            </button>
            <button onclick="resetData()" class="flex flex-col items-center text-slate-500 hover:text-red-400 transition">
                <i class="fas fa-trash-alt text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Reset</span>
            </button>
        </div>

    </div>

    <div id="modalTransaksi" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-t-[2rem] sm:rounded-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-base font-bold text-white">Tambah Transaksi</h3>
                <button onclick="tutupForm()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:bg-slate-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="transaksiForm" class="space-y-3">
                <input type="hidden" id="tipe">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Keterangan</label>
                    <input type="text" id="keterangan" required placeholder="Contoh: Gaji / Beli Makan" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Jumlah (Rp)</label>
                    <input type="number" id="jumlah" required placeholder="Contoh: 50000" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Tanggal</label>
                    <input type="date" id="tanggal" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-sky-600/30 mt-2">
                    Simpan Transaksi
                </button>
            </form>
        </div>
    </div>

    <script>
        let transaksiList = JSON.parse(localStorage.getItem('transaksi')) || [];

        const form = document.getElementById('transaksiForm');
        const keteranganInput = document.getElementById('keterangan');
        const jumlahInput = document.getElementById('jumlah');
        const tanggalInput = document.getElementById('tanggal');
        const tipeInput = document.getElementById('tipe');
        
        const totalSaldoEl = document.getElementById('totalSaldo');
        const totalMasukEl = document.getElementById('totalMasuk');
        const totalKeluarEl = document.getElementById('totalKeluar');
        const tabelTransaksiEl = document.getElementById('tabelTransaksi');
        const containerRekapBulanan = document.getElementById('containerRekapBulanan');

        tanggalInput.valueAsDate = new Date();

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        // Fungsi Format Nama Bulan dari Tanggal (Format: YYYY-MM)
        function formatBulan(tanggalStr) {
            const [tahun, bulan] = tanggalStr.split('-');
            const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${namaBulan[parseInt(bulan) - 1]} ${tahun}`;
        }

        function updateDashboard() {
            tabelTransaksiEl.innerHTML = '';
            let totalMasuk = 0;
            let totalKeluar = 0;
            let rekapData = {};

            if (transaksiList.length === 0) {
                tabelTransaksiEl.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs bg-slate-900 rounded-2xl p-4 border border-slate-800">Belum ada transaksi tercatat.</div>`;
                containerRekapBulanan.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs bg-slate-900 rounded-2xl p-4 border border-slate-800">Belum ada data untuk direkap.</div>`;
            }

            transaksiList.forEach((item, index) => {
                if (item.tipe === 'masuk') {
                    totalMasuk += Number(item.jumlah);
                } else {
                    totalKeluar += Number(item.jumlah);
                }

                // Hitung Rekapan Per Bulan
                if (item.tanggal) {
                    const kunciBulan = item.tanggal.substring(0, 7); // Mengambil YYYY-MM
                    if (!rekapData[kunciBulan]) {
                        rekapData[kunciBulan] = { masuk: 0, keluar: 0 };
                    }
                    if (item.tipe === 'masuk') {
                        rekapData[kunciBulan].masuk += Number(item.jumlah);
                    } else {
                        rekapData[kunciBulan].keluar += Number(item.jumlah);
                    }
                }

                // Render List Transaksi Home
                const card = document.createElement('div');
                card.className = "bg-slate-900 p-3.5 rounded-2xl border border-slate-800 shadow-sm flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-xs ${item.tipe === 'masuk' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">
                            <i class="fas ${item.tipe === 'masuk' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-white">${item.keterangan}</h4>
                            <span class="text-[10px] text-slate-400">${item.tanggal}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold ${item.tipe === 'masuk' ? 'text-emerald-400' : 'text-rose-400'}">
                            ${item.tipe === 'masuk' ? '+' : '-'} ${formatRupiah(item.jumlah)}
                        </span>
                        <button onclick="hapusTransaksi(${index})" class="text-slate-600 hover:text-red-400 text-xs transition">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                tabelTransaksiEl.appendChild(card);
            });

            // Render Rekapan Bulanan
            containerRekapBulanan.innerHTML = '';
            const sortedBulan = Object.keys(rekapData).sort().reverse(); // Urutkan dari bulan terbaru
            
            sortedBulan.forEach(bulan => {
                const data = rekapData[bulan];
                const sisaBulan = data.masuk - data.keluar;

                const rekapCard = document.createElement('div');
                rekapCard.className = "bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2";
                rekapCard.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="text-xs font-bold text-sky-400">${formatBulan(bulan)}</span>
                        <span class="text-[11px] font-semibold text-slate-300">Sisa: ${formatRupiah(sisaBulan)}</span>
                    </div>
                    <div class="flex justify-between text-xs pt-1">
                        <div>
                            <p class="text-[10px] text-slate-400">Masuk</p>
                            <p class="font-bold text-emerald-400">${formatRupiah(data.masuk)}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-slate-400">Keluar</p>
                            <p class="font-bold text-rose-400">${formatRupiah(data.keluar)}</p>
                        </div>
                    </div>
                `;
                containerRekapBulanan.appendChild(rekapCard);
            });

            let saldoAkhir = totalMasuk - totalKeluar;
            totalSaldoEl.innerText = formatRupiah(saldoAkhir);
            totalMasukEl.innerText = formatRupiah(totalMasuk);
            totalKeluarEl.innerText = formatRupiah(totalKeluar);

            localStorage.setItem('transaksi', JSON.stringify(transaksiList));

            const statusEl = document.getElementById('statusKeuangan');
            if (statusEl) {
                if (totalMasuk === 0 && totalKeluar === 0) {
                    statusEl.className = "mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-slate-800 text-slate-400 border border-slate-700";
                    statusEl.innerHTML = 'Belum Ada Aktivitas';
                } else if (totalMasuk >= totalKeluar) {
                    statusEl.className = "mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                    statusEl.innerHTML = '✨ Keuangan Aman';
                } else {
                    statusEl.className = "mt-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-rose-500/20 text-rose-400 border border-rose-500/30";
                    statusEl.innerHTML = '⚠️ Pengeluaran Tinggi';
                }
            }
        }

        // Fungsi Berpindah Tab Antara Home dan Rekapan
        function pindahTab(tab) {
            const tabHome = document.getElementById('tabHome');
            const tabRekap = document.getElementById('tabRekap');
            const navHome = document.getElementById('navHome');
            const navRekap = document.getElementById('navRekap');

            if (tab === 'home') {
                tabHome.classList.remove('hidden');
                tabRekap.classList.add('hidden');
                navHome.className = "flex flex-col items-center text-sky-400 transition";
                navRekap.className = "flex flex-col items-center text-slate-500 hover:text-sky-400 transition";
            } else {
                tabHome.classList.add('hidden');
                tabRekap.classList.remove('hidden');
                navRekap.className = "flex flex-col items-center text-sky-400 transition";
                navHome.className = "flex flex-col items-center text-slate-500 hover:text-sky-400 transition";
            }
        }

        function bukaForm(tipe) {
            tipeInput.value = tipe;
            document.getElementById('modalTitle').innerText = tipe === 'masuk' ? 'Tambah Pemasukan' : 'Tambah Pengeluaran';
            document.getElementById('modalTransaksi').classList.remove('hidden');
        }

        function tutupForm() {
            document.getElementById('modalTransaksi').classList.add('hidden');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const baru = {
                keterangan: keteranganInput.value,
                tanggal: tanggalInput.value,
                jumlah: Number(jumlahInput.value),
                tipe: tipeInput.value
            };
            transaksiList.push(baru);
            keteranganInput.value = '';
            jumlahInput.value = '';
            tutupForm();
            updateDashboard();
        });

        function hapusTransaksi(index) {
            if (confirm("Hapus catatan ini?")) {
                transaksiList.splice(index, 1);
                updateDashboard();
            }
        }

        function resetData() {
            if (confirm("Yakin ingin mereset semua data?")) {
                transaksiList = [];
                updateDashboard();
            }
        }

        function logout() {
            if (confirm("Keluar dari aplikasi?")) {
                localStorage.clear();
                location.reload();
            }
        }

        const inputPencarian = document.getElementById('inputPencarian');
        if (inputPencarian) {
            inputPencarian.addEventListener('keyup', function() {
                const keyword = this.value.toLowerCase();
                const cards = document.querySelectorAll('#tabelTransaksi > div');
                cards.forEach(card => {
                    const text = card.innerText.toLowerCase();
                    card.style.display = text.includes(keyword) ? 'flex' : 'none';
                });
            });
        }

        updateDashboard();
    </script>
</body>
</html>
